name: Scope search checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SCOPE_TEST_DATABASE_URL: postgresql://scope:search-local@127.0.0.1:55493/scope
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: >
          python -m pip install --only-binary=:all: -r requirements.txt
      - name: Start PostgreSQL
        run: docker compose up -d --wait --wait-timeout 120 db
      - name: Run authorization and application tests
        run: python -m unittest discover -s tests -v
      - name: Start built app
        run: docker compose up -d --build --wait --wait-timeout 120 app
      - name: Replay the warm-cache revocation scenario
        run: python -m scope_search verify --output artifacts/revocation.json
      - uses: actions/upload-artifact@v7
        with:
          name: scope-revocation
          path: artifacts/revocation.json
          if-no-files-found: error
      - name: Show app and database logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 75
      - name: Stop services
        if: always()
        run: docker compose down -v
